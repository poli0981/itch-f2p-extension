name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          echo "✓ Tag v$TAG_VERSION matches manifest.json"

      - name: Build detector & validate manifest
        run: |
          npm run validate:manifest
          npm run build:detector

      - name: Package extension
        run: npm run package

      # Use `gh release create` (atomic POST) instead of softprops/action-gh-release@v2
      # to avoid the create-then-update flow that breaks `discussion_category_name`
      # (GitHub REST PATCH does not accept that field; see softprops/action-gh-release#440).
      - name: Create GitHub Release (with auto-Discussion)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — uploading/replacing assets only."
            gh release upload "${GITHUB_REF_NAME}" dist/itch-f2p-tracker-*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/itch-f2p-tracker-*.zip \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --discussion-category Announcements
          fi
